Continue on the title screen picks it up in either build.</div><div><button style=\"font-size:18px;padding:10px 24px;margin:6px\" onclick=\"location.reload()\">Reload</button><button style=\"font-size:18px;padding:10px 24px;margin:6px\" data-u=\"../?build=webgl\" onclick=\"location.href=this.dataset.u\">Use the standard build</button></div>';document.body.appendChild(d);}window.addEventListener('error',function(e){var m=String(e.message||'');if(/RuntimeError|abort|unreachable|null function|out of memory/i.test(m))panel('The graphics engine hit an error.');});window.addEventListener('unhandledrejection',function(e){var m=String(e.reason&&(e.reason.message||e.reason)||'');if(/RuntimeError|abort|WebGPU|GPU/i.test(m))panel('The graphics engine hit an error.');});if(navigator.gpu){var rd=GPUAdapter.prototype.requestDevice;GPUAdapter.prototype.requestDevice=function(){return rd.apply(this,arguments).then(function(dev){dev.lost.then(function(i){if(i&&i.reason!=='destroyed')panel('The browser dropped the graphics device.');});return dev;});};}})();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>"
