[preset.2.options]

custom_template/debug=""
custom_template/release=""
variant/extensions_support=true
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=false
shader_baker/enabled=true
html/export_icon=true
html/custom_html_shell=""
html/head_include="<script>(function(){var shown=false;function panel(why){if(shown)return;shown=true;var d=document.createElement('div');d.id='botf-lost';d.style.cssText='position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#05070f;color:#cfe0ff;font:16px sans-serif;z-index:99;text-align:center;padding:24px';d.innerHTML='<div style=\"font-size:22px\">The full-graphics build stopped</div><div>'+why+' Your campaign autosaves every turn, so Continue on the title screen picks it up in either build.</div><div><button style=\"font-size:18px;padding:10px 24px;margin:6px\" onclick=\"location.reload()\">Reload</button><button style=\"font-size:18px;padding:10px 24px;margin:6px\" data-u=\"../?build=webgl\" onclick=\"location.href=this.dataset.u\">Use the standard build</button></div>';document.body.appendChild(d);}window.addEventListener('error',function(e){var m=String(e.message||'');if(/RuntimeError|abort|unreachable|null function|out of memory/i.test(m))panel('The graphics engine hit an error.');});window.addEventListener('unhandledrejection',function(e){var m=String(e.reason&&(e.reason.message||e.reason)||'');if(/RuntimeError|abort|WebGPU|GPU/i.test(m))panel('The graphics engine hit an error.');});if(navigator.gpu){var rd=GPUAdapter.prototype.requestDevice;GPUAdapter.prototype.requestDevice=function(){return rd.apply(this,arguments).then(function(dev){dev.lost.then(function(i){if(i&&i.reason!=='destroyed')panel('The browser dropped the graphics device.');});return dev;});};}})();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>"
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
html/experimental_virtual_keyboard=false
progressive_web_app/enabled=false
progressive_web_app/ensure_cross_origin_isolation_headers=true
progressive_web_app/orientation=0
progressive_web_app/icon_144x144=""
progressive_web_app/icon_180x180=""
progressive_web_app/icon_512x512=""
progressive_web_app/background_color=Color(0, 0, 0, 1)

