html/head_include="<script>(function(){var raf=window.requestAnimationFrame.bind(window);function zero(){return window.innerWidth===0||window.innerHeight===0;}window.requestAnimationFrame=function(cb){return raf(function step(t){if(zero()){raf(step);return;}cb(t);});};})();</script><style>#botf-boot{position:fixed;inset:0;background:#05070f;color:#cfe0ff;font:22px sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}#botf-boot i{width:44px;height:44px;box-sizing:border-box;border:4px solid #2a4064;border-top-color:#cfe0ff;border-radius:50%;animation:botfspin 1s linear infinite;will-change:transform}@keyframes botfspin{to{transform:rotate(360deg)}}#botf-boot small{font-size:15px;opacity:.8;min-height:1.2em}</style><script>(function(){function mk(){if(document.getElementById('botf-boot'))return;var d=document.createElement('div');d.id='botf-boot';d.innerHTML='<i></i><div>Starting BOTF Remastered</div><small id=botf-boot-t></small>';var c=document.getElementById('canvas');if(c&&c.parentNode)c.parentNode.insertBefore(d,c.nextSibling);else document.body.appendChild(d);}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mk);else mk();globalThis.botfBootText=function(t){var e=document.getElementById('botf-boot-t');if(e)e.textContent=t;};globalThis.botfBootDone=function(){var d=document.getElementById('botf-boot');if(d)d.remove();};setTimeout(function(){globalThis.botfBootDone();},240000);})();</script><script>document.addEventListener('webglcontextlost',function(e){e.preventDefault();if(document.getElementById('botf-lost'))return;var d=document.createElement('div');d.id='botf-lost';d.style.cssText='position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#05070f;color:#cfe0ff;font:16px sans-serif;z-index:99;text-align:center;padding:24px';d.innerHTML='<div style=\"font-size:22px\">The browser dropped the graphics context</div><div>This happens when the graphics card is reset or runs out of memory. Your campaign autosaves every turn, so Continue on the title screen picks it up.</div><button style=\"font-size:18px;padding:10px 24px\" onclick=\"location.reload()\">Reload the game</button>';document.body.appendChild(d);},true);</script><script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>"
